[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofbrowse"
version = "0.3.0"
description = "Constrained AI browser research with verifiable evidence receipts"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.40,<2"]

[project.scripts]
proofbrowse = "proofbrowse.__main__:main"

[tool.setuptools.packages.find]
include = ["proofbrowse*"]
