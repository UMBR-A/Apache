name: ProofBrowse CI

on:
  pull_request:
    paths:
      - 'experiments/proofbrowse/**'
      - '.github/workflows/proofbrowse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    defaults:
      run:
        working-directory: experiments/proofbrowse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package without browser or AI model
        run: python -m pip install -e .
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate benchmark fixtures without running agents
        run: python -m benchmark.run --dry-run --output-dir benchmark-results

  chromium-dom:
    name: Chromium DOM integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/proofbrowse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and browser
        run: |
          python -m pip install -e '.[browser]'
          python -m playwright install --with-deps chromium
      - name: Use Playwright-installed browser for DOM smoke test
        shell: bash
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              path = p.chromium.executable_path
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'PLAYWRIGHT_CHROMIUM_EXECUTABLE={path}\n')
          PY
      - name: Run unit and Chromium DOM tests
        run: python -m unittest discover -s tests -v
